name: aiops-lab

topology:
  defaults:
    kind: nokia_srlinux

  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest

  nodes:
    spine1:
      type: ixr-d3l
      startup-config: configs/startup-spine1.json

    leaf1:
      type: ixr-d2l
      startup-config: configs/startup-leaf1.json

    leaf2:
      type: ixr-d2l
      startup-config: configs/startup-leaf2.json

  links:
    - endpoints: ["spine1:e1-1", "leaf1:e1-1"]
    - endpoints: ["spine1:e1-2", "leaf2:e1-1"]
